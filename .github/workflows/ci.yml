name: CI Build and Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CareerAdvisor.sln

      - name: Build (Release)
        run: dotnet build CareerAdvisor.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test CareerAdvisor.sln --configuration Release --no-build